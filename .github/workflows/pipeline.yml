name: Java CI

on: [push, pull_request]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean compile

      - name: Run Tests with Allure
        run: mvn test -Dgroups=smoke

      - name: List Allure Results (Debug)
        run: |
          mkdir -p target/allure-results
          ls -la target/allure-results
          

      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.zip
          unzip -o allure-2.27.0.zip -d /opt/
          export PATH=$PATH:/opt/allure-2.27.0/bin
          allure --version

      - name: Generate Allure Report
        run: |
          /opt/allure-2.27.0/bin/allure generate target/allure-results --clean -o target/allure-report

      - name: List Allure Report
        run: ls -la target/allure-report

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report
